<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>

<body>

    <a-scene>

        <a-assets>
            <img id="panorama" crossorigin="anonymous" src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/sechelt.jpg">
        </a-assets>


        <a-sky src="#panorama" rotation="0 -90 0">
        </a-sky>


        <a-camera look-controls="touchEnabled: false;
                           magicWindowTrackingEnabled: true">
        </a-camera>

    </a-scene>

</body>

</html>
