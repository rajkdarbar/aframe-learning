<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <script>
        AFRAME.registerComponent('ar-hit-test', {
            init: function () {
                this.hitTestSource = null;
                this.viewerSpace = null;
                this.refSpace = null;

                this.el.sceneEl.addEventListener('enter-vr', async () => {
                    const session = this.el.sceneEl.renderer.xr.getSession();

                    if (!session) return;

                    this.viewerSpace =
                        await session.requestReferenceSpace('viewer');

                    this.hitTestSource =
                        await session.requestHitTestSource({
                            space: this.viewerSpace
                        });

                    this.refSpace =
                        await session.requestReferenceSpace('local');
                });
            },

            tick: function () {
                if (!this.hitTestSource) return;

                const frame =
                    this.el.sceneEl.renderer.xr.getFrame();

                if (!frame) return;

                const results =
                    frame.getHitTestResults(this.hitTestSource);

                if (results.length > 0) {

                    const pose =
                        results[0].getPose(this.refSpace);

                    const marker =
                        document.querySelector('#marker');

                    marker.object3D.position.set(
                        pose.transform.position.x,
                        pose.transform.position.y,
                        pose.transform.position.z
                    );

                    marker.object3D.visible = true;
                }
            }
        });
    </script>
</head>

<body>

    <a-scene xr-mode-ui="XRMode: ar" webxr="requiredFeatures: hit-test;" ar-hit-test>

        <!-- Placement marker -->
        <a-ring id="marker" radius-inner="0.07" radius-outer="0.09" rotation="-90 0 0" color="yellow" visible="false">
        </a-ring>

        <!-- Cube -->
        <a-box id="cube" width="0.2" height="0.2" depth="0.2" color="tomato" visible="false">
        </a-box>

    </a-scene>


    <script>
        const scene = document.querySelector('a-scene');

        scene.addEventListener('click', () => {

            const marker = document.querySelector('#marker');
            const cube = document.querySelector('#cube');

            if (!marker.object3D.visible) return;

            cube.object3D.position.copy(
                marker.object3D.position
            );

            // Raise cube by half its height
            cube.object3D.position.y += 0.1;

            cube.object3D.visible = true;
        });
    </script>

</body>

</html>
